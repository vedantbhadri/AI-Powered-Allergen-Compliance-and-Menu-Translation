[pytest]
# The readMenu and editMenu Lambda packages each contain a module named
# `handler`. Collecting both directories in a single pytest process makes the
# two handler modules clash in sys.modules, so the suites are run PER DIRECTORY:
#
#   py -m pytest build/read_menu/
#   py -m pytest build/edit_menu/
#   py -m pytest build/test_integration_apigw_v2.py
#   py build/test_layer_packaging.py
#
# Each directory's tests wire their own handler onto sys.path, so per-directory
# runs are fully isolated and green.
addopts = -q